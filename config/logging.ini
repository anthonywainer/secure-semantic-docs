[loggers]
keys = root,DocSecPipeline

[handlers]
keys = console

[formatters]
keys = standard

[logger_root]
level = WARNING
handlers = console

[logger_DocSecPipeline]
level = DEBUG
handlers = console
qualname = DocSecPipeline
propagate = 0

[handler_console]
class = StreamHandler
level = DEBUG
formatter = standard
args = (sys.stderr,)

[formatter_standard]
format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
datefmt = %d-%m-%Y %H:%M:%S
