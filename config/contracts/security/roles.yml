roles:
  admin:
    clearance_level: restricted
    description: Platform administrator with governed access to all safe views and text retrieval
    capabilities:
      can_access_all_records: true
      can_decrypt_text: true
      can_view_encrypted_payloads: false
      can_view_secret_keys: false
      can_view_decrypted_embeddings: false

  data_engineer:
