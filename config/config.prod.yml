# Production overrides applied when DOCSEC_ENV=prod (Docker simulation).
# Deep-merged on top of config.yml + config.dev.yml.

iceberg:
  enabled: true
  catalog_name: local
  catalog_type: rest
  catalog_uri: http://iceberg-rest:8181
  warehouse: /app/runtime/lakehouse/iceberg_warehouse

spark_confs:
  spark.sql.shuffle.partitions: 8
  spark.driver.memory: 4g
  spark.executor.memory: 2g
  spark.jars.packages: ""
  spark.jars: "/opt/spark/jars/iceberg-spark-runtime.jar"
