# Base configuration for docsec.
# All environments start from these defaults.
# Override via config.dev.yml (committed) or config.local.yml (git-ignored).

iceberg:
  enabled: false
  catalog_name: local
  catalog_type: rest
  catalog_uri: http://iceberg-rest:8181
  warehouse: /app/lakehouse/iceberg_warehouse

# Framework-level controls: managed, log_level.
# All other keys are raw Spark configuration key-value pairs passed
# directly to SparkConf. Use actual Spark conf key names (dotted notation).
spark_confs:
  managed: false
  log_level: WARN
  spark.master: "local[*]"
  spark.app.name: DocSecPipeline
  spark.sql.shuffle.partitions: 4
  spark.driver.memory: 2g
  spark.executor.memory: 1g
  spark.python.worker.reuse: "true"
  spark.jars.packages: "org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1"

readers:
  bronze_documents:
    stream: false
    options:
      format: parquet
      mergeSchema: "true"
      path: "{project_root}/lakehouse/bronze_documents"

  silver_chunks:
    stream: false
    options:
      format: parquet
      mergeSchema: "true"
      path: "{project_root}/lakehouse/silver_chunks"

  gold_embeddings:
    stream: false
    options:
      format: parquet
      mergeSchema: "true"
      path: "{project_root}/lakehouse/gold_embeddings"

  metadata_documents:
    stream: false
    options:
      format: json
      path: "{resources}/synthetic_data/metadata/documents_metadata.json"

  raw_documents:
    stream: false
    options:
      format: text
      wholetext: "true"
      recursiveFileLookup: "true"
      path: "{resources}/synthetic_data/raw_documents"

writers:
  bronze_documents:
    stream: false
    options:
      format: parquet
      mode: overwrite
      compression: snappy
      path: "{project_root}/lakehouse/bronze_documents"

  silver_chunks:
    stream: false
    options:
      format: parquet
      mode: overwrite
      compression: snappy
      path: "{project_root}/lakehouse/silver_chunks"

  gold_embeddings:
    stream: false
    options:
      format: parquet
      mode: overwrite
      compression: snappy
      path: "{project_root}/lakehouse/gold_embeddings"


chunking:
  chunk_size: 400
  chunk_overlap: 80
  default_top_k: 5
  retrieval_candidate_multiplier: 4

embedding:
  model: all-MiniLM-L6-v2
  dim: 384
  batch_size: 64 # Number of texts encoded in one forward pass. Tune up for GPU executors (128-256).
  device: auto # "auto" detects CUDA -> MPS -> CPU. Pin to "cpu" for CPU-only clusters.
  num_partitions: 0 # 0 = use spark.sparkContext.defaultParallelism (one task per executor core).
  normalize: true